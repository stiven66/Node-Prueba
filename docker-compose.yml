version: '3.8'

services:
  backend:
    build: .
    container_name: fhl_backend
    ports:
      - '3001:3001'
    depends_on:
      - db
    environment:
      - PORT=3001
      - JWT_SECRET=superseguro2025
      - DATABASE_URL=postgresql://postgres:Qwe.123*@db:5432/fhl
    volumes:
      - .:/app
    restart: always

  db:
    image: postgres:15
    container_name: fhl_db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Qwe.123*
      POSTGRES_DB: fhl
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
